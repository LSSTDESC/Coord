name: Build wheel and sdist and upload to PyPI

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build platform-independent wheel and sdist and upload to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/LSSTDESC.Coord
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -U numpy setuptools wheel
          pip install -U -r requirements.txt

      - name: Build wheel
        run: |
          pip wheel -w wheels .
          ls -l wheels

      - name: Build sdist
        run: |
          python setup.py sdist
          cp wheels/lsstdesc_coord* dist
          ls -l dist
          tar tvfz dist/lsstdesc_coord-*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
            verbose: true
